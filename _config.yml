title: "Kobe Zhang 个人博客"
author: "Kobe_zyx"
email: "kobezyuxuan@gmail.com"
description: "IT Enthusiast & Student"
baseurl: ""
url: "https://www.kobezyx.com"

# Markdown 解析设置 
markdown: kramdown
kramdown:
  input: GFM          # 开启 GitHub 风格 Markdown（支持表格、任务列表、删除线等）
  hard_wrap: false    # 像 Obsidian 一样，单次回车不换行，双次回车才换段落
  math_engine: mathjax # 开启 LaTeX 数学公式支持
  syntax_highlighter: rouge # 代码高亮引擎

plugins:
  - jekyll-seo-tag
  - jekyll-feed         
  - jekyll-admin
  - jekyll-sitemap
  # - jekyll-paginate-v2

# ==========================================================
# 分页插件配置 (Jekyll Paginate V2)
# ==========================================================
pagination:
  enabled: true
  per_page: 8
  title: ':title - 第 :num 页'
  sort_field: 'date'
  sort_reverse: true

autopages:
  enabled: true
  categories: 
    enabled: false
  collections:
    enabled: false
  tags:
    layouts: 
      - 'autopage_tags.html'
    title: '标签: :tag'
    permalink: '/tag/:tag/'