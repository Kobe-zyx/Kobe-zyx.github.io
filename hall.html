<section class="timeline-section" style="margin-top: 100px; padding-bottom: 140px;">
    <div class="container">
        <h1 style="margin-bottom: 10px;">Music Hall</h1>
        <p class="blog-intro-text">Discover and enjoy music from around the world.</p>
        <p class="blog-intro-text" style="margin-bottom: 40px;">发现并享受来自世界各地的节奏。</p>
        
        <div class="music-search-container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索歌曲、艺术家或专辑..." class="search-input">
                <button id="searchBtn" class="search-button">
                    <i data-feather="search"></i>
                </button>
            </div>
        </div>
        
        <div class="music-section" id="searchResults" style="display: none;">
            <h2 style="font-size: 1.5em; margin-top: 40px;">Search Results</h2>
            <div id="searchResultsGrid" class="music-grid"></div>
        </div>
        
        <div class="music-section">
            <h2 style="font-size: 1.5em; margin-top: 40px;">My Favorites</h2>
            <p class="blog-intro-text">Some of my favorite songs.</p>
            <p class="blog-intro-text">我所喜爱的一些歌曲。</p>
            <div id="featuredMusic" class="music-grid"></div>
        </div>

        <div class="music-player-container" id="musicPlayer" style="display: none;">
            <div class="music-player">
                <div class="player-info">
                    <img id="playerAlbumArt" src="" alt="专辑封面" class="player-album-art">
                    <div class="player-details">
                        <h3 id="playerTitle">歌曲标题</h3>
                        <p id="playerArtist">艺术家</p>
                    </div>
                </div>
                <div class="player-controls">
                    <button id="playPauseBtn" class="control-btn play-btn">
                        <i data-feather="play"></i>
                    </button>
                    <div class="progress-container">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <div class="time-display">
                            <span id="currentTime">0:00</span>
                            <span id="totalTime">0:30</span>
                        </div>
                    </div>
                    <button id="closePlayerBtn" class="control-btn close-btn" title="关闭播放器">
                        <i data-feather="x"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="/hall.js"></script>
